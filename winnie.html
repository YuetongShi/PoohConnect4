<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Winnie Wins! - Pooh Connect</title>
  <!-- Load storybook header font (Fredoka) and comic speech font (Patrick Hand) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 28px;
      background-color: #F4A938; /* Winnie's honey gold from main.html */
      border: 14px solid #D93829; /* Winnie's iconic red shirt border */
      box-sizing: border-box;
      font-family: 'Fredoka', cursive, sans-serif;
      text-align: center;
      padding: 24px;
    }

    h1 {
      margin: 0;
      font-size: 68px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #FFFDF5;
      text-shadow:
        -3px -3px 0 #5C330A,
         3px -3px 0 #5C330A,
        -3px  3px 0 #5C330A,
         3px  3px 0 #5C330A,
         0px  8px 18px rgba(74, 37, 4, 0.45);
      user-select: none;
    }

    /* Comic-style quote bubble */
    .comic-quote {
      font-family: 'Patrick Hand', cursive, sans-serif;
      font-size: 34px;
      color: #4A2504;
      background-color: #FFFDF5;
      padding: 18px 36px;
      border: 4px solid #D93829;
      border-radius: 30px;
      box-shadow: 0 8px 20px rgba(74, 37, 4, 0.25);
      max-width: 540px;
    }

    button {
      margin-top: 12px;
      min-width: 240px;
      padding: 18px 40px;
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: #FFFDF5;
      background-color: #D93829;
      border: 4px solid #4A2504;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(74, 37, 4, 0.35);
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    button:hover {
      background-color: #E84A3C;
      transform: translateY(-3px) scale(1.04);
    }

    button:active {
      transform: translateY(1px) scale(0.98);
    }
  </style>
</head>
<body>

  <h1>Winner! Winnie the Pooh</h1>

  <div class="comic-quote">
    “Oh, bother... I seem to have connected four!”
  </div>

  <button onclick="window.location.href='main.html'">Back to Hundred Acre Wood</button>

</body>
</html>
